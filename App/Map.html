<!DOCTYPE html>
<html lang="en">

<head>
    <title>Heritage Scope</title>
    <!-- Character encoding -->
    <meta charset="UTF-8">
    <!-- Makes it responsive on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Optional: description for SEO -->
    <meta name="description" content="Heritage and cultural site map and simulation">
    <!-- Links to leaflet CSS file [following a tutorial rn]-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="">
        </script>
    <!-- Import leaflet cluster CSS and JS-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Import team's main javascript file that governs the ENTIRE functionality -->
    <script defer type="module" src="main.js"></script>

    <!-- Import custom styles team have made -->
    <link rel="stylesheet" href="./styles/styles.css">
    <link rel="stylesheet" href="./styles/accessibility.css">

</head>

<body class="map-page">
    <div class="mapLayout">
        <section class="pageUtilityBar">
            <div id="multi_toolbar" class="toolbar topAccessibilityBar">
                <span class="utilityLabel">Text Size</span>
                <button class="font-btn" id="smallText" data-size="normal">A</button>
                <button class="font-btn" id="mediumText" data-size="large">A+</button>
                <button class="font-btn" id="largeText" data-size="xlarge">A++</button>
                <button id="contrast-btn">High Contrast</button>
            </div>
        </section>

        <section class="mapTopSection">
            <div id="infoToast" class="utilityToast">
                <span class="utilityLabel">Info</span>
                <div id="info">When zooming out in the map the number is the number shown is the number of
                    cultural sites in that area chunk</div>
                <button id="infoToastClose" class="utilityToastClose" type="button" aria-label="Close info notice">&#x274E;</button>
            </div>

            <div class="mapShell">
                <div id="map"></div>
            </div>
        </section>

        <section id="routePreview" class="routePreviewCard">
            <div class="routePreviewHeader">
                <h2>Heritage Sites Navigator Demo</h2>
                <div class="routeModeRow">
                    <button class="routeModeBtn routeModeBtnWalk" type="button">Walking</button>
                    <button class="routeModeBtn" type="button">Wheelchair</button>
                </div>
                <div class="routeSearchRow">
                    <div class="routeSearchGroup">
                        <label>Destination</label>
                        <input type="text" placeholder="e.g. Birmingham Museum" />
                    </div>
                    <div class="routeActionRow">
                        <button class="routeGhostBtn" type="button">Locate</button>
                        <button class="routePrimaryBtn" type="button">Go</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="mapBottomSplit">
            <div class="splitPanel utilityPanel">
                <div class="splitPanelHeader">Utility</div>
                <div class="utilityPanelBody">
                    <div id="simulationToolbar" class="toolbar utilitySection">
                        <span class="utilityLabel">Tools</span>
                        <button id="status-btn" onclick="handleStatusToggle()">Show At-Risk Sites</button>
                        <button id="simulationTrigger" type="button">Open Simulation</button>
                    </div>

                    <div id="areaHighlightToolbar" class="toolbar utilitySection">
                        <span class="utilityLabel">Area Highlight</span>
                        <input id="lidInput" placeholder="LID" style="width: 100px;">
                        <button id="areaMarkRun">Run</button>
                    </div>
                </div>
            </div>
            <div class="splitPanel splitPanelPlaceholder">
                <div class="splitPanelHeader">Panel</div>
                <div class="splitPlaceholderText">WIP</div>
            </div>
        </section>
    </div>

    <dialog id="simulationDialog" class="simulationDialog">
        <div class="simulationDialogShell">
            <div class="simulationDialogHeader">
                <h3>Environmental Simulation</h3>
                <button id="closeSimulationDialog" class="simulationDialogClose" type="button"
                    aria-label="Close simulation">Close</button>
            </div>
            <iframe class="simulationDialogFrame" src="./Simulation/simulation.html" title="Environmental Simulation"
                loading="lazy"></iframe>
        </div>
    </dialog>

    <script src="../Accessibility/TTS.js"></script>
</body>

</html>
