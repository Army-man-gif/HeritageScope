<!DOCTYPE html>
<html>

<head>
<!-- put the css and js files in the head section -->
<link rel="stylesheet" href="../styles/SimStyles.css">
<title>Environmental Simulation</title>
</head>

<body>

<h1 id = "title"> Environmental Simulation</h1>
<p id = "intro"> This is an environment simulation. Use the sliders to see the effects of different actions on the environment.</p>

<div class = "container">
    <!-- slider containers -->
    <div class = "sliders">
        <h2 id = "slidersIntro">Sliders:</h2>

        <div class="slidecontainer">
            <p id = "trafficPara">Traffic: <span id="trafficVal"></span>/100</p>
            <!-- start traffic at 20 -->
            <input type="range" min="0" max="100" value="20" class="slider" id="trafficSlider">
        </div>

        <div class="slidecontainer">
            <p id = "touristPara">Tourists: <span id="touristVal"></span>/100</p>
            <!-- start tourists at 50 -->
            <input type="range" min="0" max="100" value="30" class="slider" id="touristSlider">
        </div>

        <div class="slidecontainer">
            <p id = "litterPara">Litter: <span id="litterVal"></span>/100</p>
            <input type="range" min="0" max="100" value="20" class="slider" id="litterSlider">
        </div>

        <div class="slidecontainer">
            <p id = "rainfallPara">Rainfall: <span id="rainfallVal"></span>/100</p>
            <!-- start rainfall at 50 -->
            <input type="range" min="0" max="100" value="50" class="slider" id="rainfallSlider">
        </div>

        <div class="slidecontainer">
            <p id = "tempPara">Temperature: <span id="tempVal"></span>/100</p>
            <!-- start temp at 50 -->
            <input type="range" min="0" max="100" value="50" class="slider" id="tempSlider">
        </div>
    
    <!-- simulation -->
    </div>

    <!-- simulation -->
    <div class = "simulation-area">

        <div class="simulation">


            <img id="simBackground" src="images/green-background.png">

            <div id="cars"></div>
            <div id="trees"></div>
            <div id="floods"></div>
            <div id="buildings"></div>
            <div id="litter"></div>
            <div id="people"></div>

        </div>

        <div class = "simulationText">
            <h3 id = "simIntro">Text description of the Simulation:</h3>
            <p id = "trafficText"></p>
            <p id = "peopleText"></p>
            <p id = "litterText"></p>
            <p id = "rainfallText"></p>
            <p id = "tempText"></p>
        </div>

    </div>

</div>

<!-- js goes at the end of body, loads quicker -->
<script src="script.js"></script>
<!-- for testing -->
<script src="../../Tests/Simulation/test.js"></script>

</body>
</html>
