<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Report Form</title>
    <link rel="stylesheet" href="userReports.css">

<body>

    <div id="reportContainer">

        <h1>Report Form</h1>

        <section>

            <h2>Enter Details</h2>

            <form id="reportForm">

                <label for="category">Category</label>
                <select id="category">
                    <option value="">Select</option>
                    <option value="accessibility">Accessibility</option>
                    <option value="safety">Safety</option>
                    <option value="environmental">Environmental</option>
                </select>

                <label for="severity">Severity</label>
                <select id="severity">
                    <option value="">Select</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>

                <fieldset>
                    <legend>Affected Groups</legend>

                    <label>
                        <input type="checkbox" value="wheelchair-users">
                        Wheelchair users
                    </label>

                    <label>
                        <input type="checkbox" value="visually-impaired">
                        Visually impaired
                    </label>

                    <label>
                        <input type="checkbox" value="parents-with-prams">
                        Parents with prams
                    </label>
                </fieldset>

                <label>Description</label>
                <textarea id="description"></textarea>

                <div class="locationBox">
                    <p>Latitude: <span id="lat">-</span></p>
                    <p>Longitude: <span id="lng">-</span></p>
                </div>

                <button type="submit">Submit</button>

            </form>

        </section>

        <section>

            <h2>Reports</h2>

            <div id="reportsList"></div>

        </section>

    </div>

     <script type="module">
     import { initUserReports } from "../App/userReports.js";
            initUserReports();
     </script>

    <script>
    window.addEventListener("message", function (event) {
        if (event.data && event.data.type === "report-location") {
            document.getElementById("lat").textContent = event.data.lat;
            document.getElementById("lng").textContent = event.data.lng;
        }
    });
    </script>

</body>
</html>
