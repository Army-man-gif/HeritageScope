<!DOCTYPE html>
<html>

<head>
<!-- put the css and js files in the head section -->
<link rel="stylesheet" href="style.css">
<title>Environmental Simulation</title>
</head>

<body>

<h1>Environmental Simulation</h1>
<p>This is an environment simulation. Use the sliders to see the effects of different actions on the environment.</p>

<div class = "container">
    <!-- slider containers -->
    <div class = "sliders">
        <h2>Sliders:</h2>

        <div class="slidecontainer">
            <p>Traffic: <span id="trafficVal"></span>/100</p>
            <input type="range" min="0" max="100" value="0" class="slider" id="trafficSlider">
        </div>

        <div class="slidecontainer">
            <p>Tourists: <span id="touristVal"></span>/100</p>
            <input type="range" min="0" max="100" value="0" class="slider" id="touristSlider">
        </div>

        <div class="slidecontainer">
            <p>Litter: <span id="litterVal"></span>/100</p>
            <input type="range" min="0" max="100" value="0" class="slider" id="litterSlider">
        </div>

        <div class="slidecontainer">
            <p>Rainfall: <span id="rainfallVal"></span>/100</p>
            <input type="range" min="0" max="100" value="0" class="slider" id="rainfallSlider">
        </div>

        <div class="slidecontainer">
            <p>Temperature: <span id="tempVal"></span>/100</p>
            <input type="range" min="0" max="100" value="0" class="slider" id="tempSlider">
        </div>
    
    <!-- simulation -->
    </div>

    <!-- simulation -->
    <div class = "simulation-area">

        <div class="simulation">

        <div id="greenspace">

            <img src="images/green-background.png" id="greenImage">

            <div id="cars"></div>
            <div id="smoke"></div>
            <div id="trees"></div>
            <div id="flood"></div>
            <div id="building"></div>

        </div>
        </div>

        <div class = "simulationText">
            <p>test simulation text ... blah blah</p>
        </div>

    </div>

</div>

<!-- js goes at the end of body, loads quicker -->
<script src="script.js"></script>

</body>
</html>
